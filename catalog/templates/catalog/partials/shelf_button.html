<form hx-post="{% url 'shelf_toggle' book.slug %}" hx-swap="outerHTML" method="post" action="{% url 'shelf_toggle' book.slug %}">
  {% csrf_token %}
  <button class="btn-outline w-full {% if on_shelf %}!border-accent text-accent{% endif %}" aria-pressed="{{ on_shelf|yesno:'true,false' }}">
    <svg class="h-4 w-4" viewBox="0 0 24 24" fill="{% if on_shelf %}currentColor{% else %}none{% endif %}" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
    {% if on_shelf %}On your shelf{% else %}Want to read{% endif %}
  </button>
</form>
