<!DOCTYPE html>
<html lang="en">
<body style="margin:0;background:#fbf6ec;font-family:Georgia,serif;color:#2a1f17;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#fffdf8;border:1px solid #e6d9c2;border-radius:16px;">
        <tr><td style="padding:28px 32px 8px;font-size:20px;font-weight:bold;">Retro<span style="color:#d9481c;">Book</span>Store</td></tr>
        <tr><td style="padding:8px 32px;">
          <p style="font-size:14px;color:#8a7867;margin:0 0 12px;">Hi {{ user.first_name|default:user.username }},</p>
          <h1 style="font-size:22px;line-height:1.3;margin:0 0 12px;">{{ title }}</h1>
          {% if body %}<p style="font-family:Arial,sans-serif;font-size:15px;line-height:1.6;color:#5b4a3c;margin:0 0 20px;">{{ body }}</p>{% endif %}
        </td></tr>
        <tr><td style="padding:0 32px 28px;font-family:Arial,sans-serif;font-size:12px;color:#8a7867;">Happy reading 📚<br>You can turn off these emails in your account settings.</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
