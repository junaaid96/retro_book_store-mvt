{% if messages %}
<div class="pointer-events-none fixed inset-x-0 top-20 z-50 flex flex-col items-center gap-2 px-4" aria-live="polite">
  {% for message in messages %}
    <div x-data="toast({% if message.level_tag == 'error' %}9000{% else %}6000{% endif %})" x-show="show"
         x-transition:leave="transition duration-300" x-transition:leave-end="opacity-0 -translate-y-2"
         class="toast pointer-events-auto w-full max-w-md animate-rise" role="{% if message.level_tag == 'error' %}alert{% else %}status{% endif %}">
      <span class="text-lg" aria-hidden="true">{% if message.level_tag == 'error' %}⚠️{% elif message.level_tag == 'success' %}✅{% else %}💡{% endif %}</span>
      <p class="flex-1 pt-0.5">{{ message }}</p>
      <button type="button" @click="show = false" class="text-muted hover:text-ink" aria-label="Dismiss">✕</button>
    </div>
  {% endfor %}
</div>
{% endif %}
