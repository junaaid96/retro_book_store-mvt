{% load retro %}<span class="inline-flex items-center gap-0.5 text-mustard" aria-label="{{ rating|floatformat:1 }} out of 5 stars">{% for s in rating|stars %}<svg class="{{ size|default:'h-4 w-4' }}" viewBox="0 0 20 20" aria-hidden="true">{% if s == 'half' %}<defs><linearGradient id="h{{ forloop.counter }}"><stop offset="50%" stop-color="currentColor"/><stop offset="50%" stop-color="currentColor" stop-opacity=".25"/></linearGradient></defs>{% endif %}<path fill="{% if s == 'full' %}currentColor{% elif s == 'half' %}url(#h{{ forloop.counter }}){% else %}currentColor{% endif %}" {% if s == 'empty' %}fill-opacity=".25"{% endif %} d="M10 1.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L10 14.9l-5.2 2.7 1-5.8L1.5 7.7l5.9-.9z"/></svg>{% endfor %}</span>
